# OpenPath English: private owner-only demo on Render (docs/product/RENDER_DEMO.md).
# One free web service in Singapore: the development build of the English app behind a server-side password.
# No database, no account server, no connection to any other service. Deploys only when started by hand.
services:
  - type: web
    name: openpath-english-demo
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    buildCommand: cd frontend && npm ci && OPENPATH_COMMIT="$RENDER_GIT_COMMIT" npm run english:build
    startCommand: node frontend/scripts/demo-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      # the scrypt hash from `node frontend/scripts/demo-hash-password.mjs`, never the password (prompted, not stored here)
      - key: DEMO_PASSWORD_HASH
        sync: false
      # signs session cookies; a new value logs everyone out (generated by Render, 256 bits)
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: DEMO_SESSION_HOURS
        value: "168"
