name: My Learning Year
on:
  pull_request:
    paths:
      [
        "packages/learning/**",
        "packages/english-core/src/**",
        "packages/mathematics/src/**",
        "content/learning/**",
        "content/mathematics/curriculum.v1.json",
        "backend/family/**",
        "frontend/src/year/**",
        "frontend/src/writing/**",
        "frontend/e2e/keyboard-dashboard.test.mjs",
        "frontend/e2e/grade7-entry.test.mjs",
        "frontend/e2e/grade7-session.test.mjs",
        "frontend/e2e/grade7-practice.test.mjs",
        "frontend/e2e/grade7-completion.test.mjs",
        "frontend/e2e/writing-components.test.mjs",
        "frontend/e2e/keyboard-policy-components.test.mjs",
        "frontend/src/learning/**",
        "frontend/e2e/learning-year.test.mjs",
        "frontend/scripts/build-year.mjs",
        "frontend/src/curriculum/**",
        "frontend/e2e/curriculum.test.mjs",
        "frontend/scripts/build-curriculum.mjs",
        "frontend/src/review/**",
        "frontend/e2e/educator-marking.test.mjs",
        "frontend/e2e/educator-access.test.mjs",
        "frontend/e2e/integrated-skills.test.mts",
        "frontend/e2e/deep-recovery-app.test.mts",
        "frontend/e2e/run-deep-recovery.sh",
        ".github/workflows/learning-year.yml",
        ".github/scripts/year-summary.py",
      ]
  # manual run (Actions tab or API); takes effect once this file is on the default branch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  year:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: python manage.py test --noinput
        working-directory: backend
      - run: npm run typecheck && npm test
        working-directory: frontend
      # the content pipeline's outputs are generated: they must match their sources
      - name: Library, parity and coverage are up to date
        working-directory: frontend
        run: |
          node --import tsx ../packages/learning/scripts/specs.ts
          node --import tsx ../packages/learning/scripts/library.ts
          node --import tsx ../packages/learning/scripts/families-parity.ts
          node --import tsx ../packages/learning/scripts/coverage.ts
          python3 ../content/learning/src/expansion.py
          node --import tsx ../packages/learning/scripts/board-releases.ts
          node --import tsx ../packages/learning/scripts/compile-coverage.ts
          git diff --exit-code ../content/learning/family-specs.v1.json ../content/learning/generated.v1.json ../content/learning/library.v1.json ../content/learning/families-parity.v1.json ../docs/learning-year/COVERAGE.md ../content/learning/competency-expansion.v1.json ../content/learning/syllabus ../content/learning/curricula ../packages/learning/src/board-releases.ts ../content/learning/coverage-matrix.v1.json ../docs/mathematics/COVERAGE_MATRIX.md ../content/learning/marking-parity.v1.json
      - run: node scripts/build-mathematics-journey.mjs && node scripts/build-year.mjs --test && node scripts/build-curriculum.mjs --test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Journeys A–F through the UI against the real Django API. The TEST BUILD treats questions as reviewed so that a
      # verified skill can be shown (it says so on every screen); synthetic learners only; nothing is deployed.
      - name: Browser acceptance journeys (learners, platform scenarios, educator review)
        shell: bash
        run: |
          python backend/manage.py migrate --noinput
          # TEST ONLY: a per-pupil clock for synthetic pupils, so a delayed check can be reached (no record is changed)
          export OPENPATH_TEST_CLOCK_FILE=/tmp/year-clock.json
          echo '{}' > "$OPENPATH_TEST_CLOCK_FILE"
          # many synthetic accounts are registered in one run (learners and reviewers): a test-only registration rate
          OPENPATH_ACCOUNT_RATE=1000/hour python backend/manage.py runserver 127.0.0.1:8014 --noreload --nothreading > /tmp/year-api.log 2>&1 &
          api_pid=$!
          PORT=4190 API_TARGET=http://127.0.0.1:8014 node frontend/scripts/preview-english.mjs > /tmp/year-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$api_pid" "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/api/account/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          # Every suite runs even if an earlier one fails; each writes its own log, and results go to summary.json
          # (one small file to read instead of the whole job log) and to the job summary.
          LOGS=/tmp/year-screens/logs; mkdir -p "$LOGS"; : > /tmp/year-results.tsv
          suite() {
            local name=$1; shift
            local t0=$SECONDS status=pass
            if ! "$@" > "$LOGS/$name.log" 2>&1; then
              status=fail
              grep -E "^not ok|✖|error:|Error|expected|actual" "$LOGS/$name.log" | head -40 | while IFS= read -r line; do echo "::error title=$name::$line"; done
            fi
            printf '%s\t%s\t%s\n' "$name" "$status" "$((SECONDS - t0))" >> /tmp/year-results.tsv
            echo "$name: $status ($((SECONDS - t0))s)"
          }
          export OPENPATH_TEST_CLOCK_FILE CHROMIUM_PATH=''
          suite learning-year env YEAR_MANAGE="python backend/manage.py" YEAR_API=django SHOTS=/tmp/year-screens/ node --import tsx --test e2e/learning-year.test.mjs
          suite curriculum env YEAR_API=django SHOTS=/tmp/year-screens/curriculum/ node --import tsx --test e2e/curriculum.test.mjs
          # geometry/dice integration: two dice misconceptions and two geometry skills, each through the Year UI and this API: one
          # wrong answer, the engine's investigation, the explanation (pending review), guided, a fresh same-skill recheck, reload;
          # nine days on a wrong delayed check, the skill's general explanation, a fresh same-skill recheck, reload
          suite integrated-skills env PATHWAY_API=http://127.0.0.1:8014 FAIL_BODY=/tmp/year-screens/integrated-fail INTEGRATED_RESULTS=/tmp/year-screens/integrated-skills.json node --import tsx e2e/integrated-skills.test.mts
          # maths expansion: one wrong answer → explanation (pending review) → guided → fresh recheck → reload, then a wrong
          # delayed check nine days on → a fresh question on the same competency → reload, for six blueprint modules
          suite maths-expansion env PATHWAY_API=http://127.0.0.1:8014 FAIL_BODY=/tmp/year-screens/maths-expansion-fail MATHS_EXPANSION_RESULTS=/tmp/year-screens/maths-expansion-browser.json node --import tsx e2e/maths-expansion-browser.test.mts
          # deep-recovery@0 (RESEARCH, off by default): the switch exists only in a --test --deep-recovery build; single and multiple
          # gaps to a fresh unaided goal question, reload / sign-out / resume, a failed save, missing content, no fresh question, switch off
          # three builds: the research switch (main cases), a lower sitting limit (pause and resume), the shipped build (switch absent)
          suite deep-recovery env DEEP_API=http://127.0.0.1:8014 DEEP_OUT=/tmp/year-screens/deep-recovery bash e2e/run-deep-recovery.sh
          # Keyboard integration uses the actual provisional-content builds, not the educator-review fixture.
          node scripts/build-year.mjs
          node scripts/build-curriculum.mjs
          suite writing-keyboard-components node --test e2e/writing-components.test.mjs e2e/keyboard-policy-components.test.mjs
          suite keyboard-dashboard env YEAR_URL=http://127.0.0.1:4190 SHOTS=/tmp/year-screens/keyboard node --import tsx --test e2e/keyboard-dashboard.test.mjs
          suite grade7-entry env YEAR_URL=http://127.0.0.1:4190 SHOTS=/tmp/year-screens/grade7 node --test e2e/grade7-entry.test.mjs
          suite grade7-session env YEAR_URL=http://127.0.0.1:4190 SHOTS=/tmp/year-screens/grade7-session node --import tsx --test e2e/grade7-session.test.mjs
          suite grade7-practice env YEAR_URL=http://127.0.0.1:4190 SHOTS=/tmp/year-screens/grade7-practice node --import tsx --test e2e/grade7-practice.test.mjs
          suite grade7-completion env YEAR_URL=http://127.0.0.1:4190 SHOTS=/tmp/year-screens/grade7-completion node --import tsx --test e2e/grade7-completion.test.mjs
          # Educator hand-off on the same shipped build and Django API: marking written work, and an administrator granting
          # and removing the educator role. Synthetic accounts only; the administrator is a synthetic superuser the test
          # sets through manage.py in this throwaway database (no secret, no real account).
          suite educator-marking env YEAR_URL=http://127.0.0.1:4190 YEAR_MANAGE="python backend/manage.py" SHOTS=/tmp/year-screens/educator-marking/ node --import tsx --test e2e/educator-marking.test.mjs
          suite educator-access env YEAR_URL=http://127.0.0.1:4190 YEAR_MANAGE="python backend/manage.py" SHOTS=/tmp/year-screens/educator-access/ node --import tsx --test e2e/educator-access.test.mjs
          python3 ../.github/scripts/year-summary.py /tmp/year-results.tsv "$LOGS" /tmp/year-screens/summary.json
          if grep -q $'\tfail\t' /tmp/year-results.tsv; then
            tail -20 /tmp/year-api.log | while IFS= read -r line; do echo "::warning::api: $line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: my-learning-year-screens
          path: /tmp/year-screens/
          retention-days: 14
          if-no-files-found: ignore
