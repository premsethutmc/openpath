name: Standalone Spelling Bee
on:
  pull_request:
    paths: ['frontend/**', 'backend/family/**', '.github/workflows/spelling-bee-standalone.yml']
  push:
    branches: ['feat/spelling-bee-standalone-learning']
permissions:
  contents: read
jobs:
  private-build-and-phone-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test src/english/logic/spelling-learning.test.ts
      - run: node scripts/build-spelling-bee.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test e2e/spelling-standalone.test.mjs
      # Validation only. Never publishes an artifact or deploys a service.
