name: OpenPath Quit India
on:
  pull_request:
    paths:
      - 'frontend/history/quit-india/**'
      - 'frontend/e2e/history-quit-india.test.mjs'
      - '.github/workflows/history-quit-india.yml'
permissions:
  contents: read
jobs:
  mobile:
    name: Explore the 1942 episode on mobile Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test history/quit-india/story.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-timeout=40000 e2e/history-quit-india.test.mjs
