name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Naming the shell turns on pipefail, so `tests | tee log` fails when tests do.
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpath
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        # a job's defaults.run replaces the workflow's: name the shell again, or `tests | tee log` hides failures
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: CI self-check (a failing test must fail this job)
        run: |
          # this step's shell must have pipefail, or `tests | tee log` reports success when tests fail
          if (false | true); then echo "::error title=CI self-check::pipefail is off in this job"; exit 1; fi
          bash "$GITHUB_WORKSPACE/.github/scripts/test-require-tests.sh"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests on PostgreSQL
        env:
          DATABASE_URL: postgres://openpath:openpath@127.0.0.1:5432/openpath
        run: |
          python manage.py test 2>&1 | tee test-postgres.log
          ../.github/scripts/require-tests.sh test-postgres.log "Backend on PostgreSQL (Python ${{ matrix.python }})"
      - name: Tests on SQLite
        run: |
          python manage.py test 2>&1 | tee test-sqlite.log
          ../.github/scripts/require-tests.sh test-sqlite.log "Backend on SQLite (Python ${{ matrix.python }})"
      - name: Settings load with debug off
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only
          DJANGO_ALLOWED_HOSTS: example.org
        run: python manage.py check

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        # a job's defaults.run replaces the workflow's: name the shell again, or `tests | tee log` hides failures
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: CI self-check (a failing test must fail this job)
        run: |
          # this step's shell must have pipefail, or `tests | tee log` reports success when tests fail
          if (false | true); then echo "::error title=CI self-check::pipefail is off in this job"; exit 1; fi
          bash "$GITHUB_WORKSPACE/.github/scripts/test-require-tests.sh"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Engine parity tests
        run: |
          npm test 2>&1 | tee test.log
          ../.github/scripts/require-tests.sh test.log "Frontend engine parity"
      - name: Production build
        run: npm run build
      - name: Standalone build
        run: npm run build:standalone
      - name: English web app build
        run: npm run english:build
      - name: Build outputs exist
        run: |
          test -s dist-english/index.html
          test -s dist-english/assets/app.js
          test -s dist-english/sw.js
          test -s dist-english/_headers
          test -s dist-english/licences/SCOWL-Copyright.txt
          test -s dist/index.html
          test -s dist/assets/app.js
          test -s dist/assets/app.css
          test -s dist/openpath-standalone.html
      - name: Private demo server (login wall, sessions, limits) and no secret in the built app
        env:
          # sentinel values: the English build must never read or embed them
          DEMO_PASSWORD_HASH: sentinel-demo-password-hash-must-not-appear
          DEMO_SESSION_SECRET: sentinel-demo-session-secret-must-not-appear
          DEMO_SENTINEL: sentinel-demo-
        run: |
          npm run english:build
          node --test scripts/demo-server.test.mjs 2>&1 | tee demo-server.log
          ../.github/scripts/require-tests.sh demo-server.log "Private demo server"

  e2e:
    name: Browser end-to-end (production build, API, PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpath
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openpath:openpath@127.0.0.1:5432/openpath
      # Run Django the way production would, except that the tests may move
      # the clock forward to exercise the retention rule.
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      OPENPATH_TRUST_CLIENT_CLOCK: "1"
      # the browser talks to the API over plain http on localhost here; production keeps cookies HTTPS-only
      OPENPATH_SECURE_COOKIES: "0"
      OPENPATH_ACCOUNT_RATE: "1000/hour"
    steps:
      - uses: actions/checkout@v7
      - name: CI self-check (a failing test must fail this job)
        run: |
          # this step's shell must have pipefail, or `tests | tee log` reports success when tests fail
          if (false | true); then echo "::error title=CI self-check::pipefail is off in this job"; exit 1; fi
          bash "$GITHUB_WORKSPACE/.github/scripts/test-require-tests.sh"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        working-directory: frontend
        run: npm run build
      - name: Start the API
        working-directory: backend
        run: |
          python manage.py migrate
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../api.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/
      - name: Serve the production build
        working-directory: frontend
        run: |
          nohup npm run preview > ../web.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/
      - name: Play the game in a real browser
        working-directory: frontend
        env:
          E2E_URL: http://localhost:4173
          E2E_SHOTS: e2e/shots
        run: |
          npm run e2e 2>&1 | tee e2e.log
          ../.github/scripts/require-tests.sh e2e.log "Browser end-to-end"
      - name: Serve the English web app (static, no API)
        working-directory: frontend
        run: |
          npm run english:build
          nohup npm run english:preview > ../english-web.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4174/
      - name: English web app in a phone-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4174
          E2E_SHOTS: e2e/shots
        run: |
          npm run english:e2e 2>&1 | tee english-e2e.log
          ../.github/scripts/require-tests.sh english-e2e.log "English web app end-to-end"
      - name: Spelling Bee in an Android-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4174
          E2E_SHOTS: e2e/shots/bee
        run: |
          npm run english:e2e-bee 2>&1 | tee english-bee-e2e.log
          ../.github/scripts/require-tests.sh english-bee-e2e.log "Spelling Bee end-to-end"
      - name: My Words in an Android-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4174
          E2E_SHOTS: e2e/shots/mywords
        run: |
          npm run english:e2e-mywords 2>&1 | tee english-mywords-e2e.log
          ../.github/scripts/require-tests.sh english-mywords-e2e.log "My Words end-to-end"
      - name: My Books in an Android-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4174
          E2E_SHOTS: e2e/shots/books
        run: |
          npm run english:e2e-books 2>&1 | tee english-books-e2e.log
          ../.github/scripts/require-tests.sh english-books-e2e.log "My Books end-to-end"
      - name: Serve the English web app with its account API
        working-directory: frontend
        run: |
          PORT=4175 API_TARGET=http://127.0.0.1:8000 nohup npm run english:preview > ../english-api-web.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4175/
      - name: Parent accounts, pupils and persistence in a phone-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4175
          E2E_SHOTS: e2e/shots/accounts
        run: |
          npm run english:e2e-accounts 2>&1 | tee english-accounts-e2e.log
          ../.github/scripts/require-tests.sh english-accounts-e2e.log "English parent accounts end-to-end"
      - name: A parent's own material in a parent account (phone-sized browser)
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4175
          E2E_SHOTS: e2e/shots/parent-content
        run: |
          npm run english:e2e-parent-content 2>&1 | tee english-parent-content-e2e.log
          ../.github/scripts/require-tests.sh english-parent-content-e2e.log "Parent content in an account end-to-end"
      - name: Developer diagnostics in a phone-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4175
          E2E_SHOTS: e2e/shots/developer
          E2E_CLAIM_CMD: cd ../backend && python manage.py developer issue-claim
        run: |
          npm run english:e2e-developer 2>&1 | tee english-developer-e2e.log
          ../.github/scripts/require-tests.sh english-developer-e2e.log "Developer diagnostics end-to-end"
      - name: Spelling check by dictation in a phone-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4175
          E2E_SHOTS: e2e/shots/spelling
          E2E_CLAIM_CMD: cd ../backend && python manage.py developer issue-claim
        run: |
          npm run english:e2e-spelling 2>&1 | tee english-spelling-e2e.log
          ../.github/scripts/require-tests.sh english-spelling-e2e.log "Spelling check end-to-end"
      - name: A pilot build refuses to build with no approvals, and builds from the recorded ones
        working-directory: frontend
        run: |
          if node scripts/build-english.mjs --pilot --no-approvals --out=dist-english-pilot; then echo "the pilot build must fail closed"; exit 1; fi
          node scripts/build-english.mjs --pilot --out=dist-english-pilot
      - name: Serve the pilot build made from the recorded approvals
        working-directory: frontend
        run: |
          node scripts/build-english.mjs --pilot --out=dist-english-pilot-approved
          PORT=4178 DIST=dist-english-pilot-approved nohup npm run english:preview > ../english-pilot-approved-web.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4178/
      - name: Spelling Bee in the approved pilot build, in an Android-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4178
          E2E_SHOTS: e2e/shots/pilot-bee
        run: |
          npm run english:e2e-pilot-bee 2>&1 | tee english-pilot-bee-e2e.log
          ../.github/scripts/require-tests.sh english-pilot-bee-e2e.log "Pilot Spelling Bee end-to-end"
      - name: Serve a pilot build with nothing approved (test build)
        working-directory: frontend
        run: |
          node scripts/build-english.mjs --pilot --no-approvals --allow-empty --out=dist-english-pilot
          PORT=4177 DIST=dist-english-pilot nohup npm run english:preview > ../english-pilot-web.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4177/
      - name: Pilot content-safety boundary in a phone-sized browser
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4177
          E2E_SHOTS: e2e/shots/pilot
        run: |
          npm run english:e2e-pilot 2>&1 | tee english-pilot-e2e.log
          ../.github/scripts/require-tests.sh english-pilot-e2e.log "Pilot boundary end-to-end"
      - name: Private demo behind its login, in an Android-sized browser
        working-directory: frontend
        env:
          E2E_SHOTS: e2e/shots/demo
        run: |
          npm run english:e2e-demo 2>&1 | tee english-demo-e2e.log
          ../.github/scripts/require-tests.sh english-demo-e2e.log "Private demo end-to-end"
      - name: Show server logs
        if: failure()
        run: tail -n 60 api.log web.log english-web.log english-api-web.log english-pilot-web.log english-pilot-approved-web.log
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: frontend/e2e/shots
          if-no-files-found: ignore

  english:
    name: English core (typecheck, acceptance tests, simulation, demo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: CI self-check (a failing test must fail this job)
        run: |
          # this step's shell must have pipefail, or `tests | tee log` reports success when tests fail
          if (false | true); then echo "::error title=CI self-check::pipefail is off in this job"; exit 1; fi
          bash "$GITHUB_WORKSPACE/.github/scripts/test-require-tests.sh"
      - uses: actions/setup-node@v7
        with:
          # 22.18+ runs TypeScript directly; no build step and no new dependencies.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript (already pinned in the frontend lockfile)
        working-directory: frontend
        run: npm ci
      - name: Frozen framework versions are unchanged
        run: node tools/english/lock.ts --check
      - name: Item bank checks (content, coverage gates, recorded gaps)
        run: node tools/english/bank/main.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generated spelling items match the word bank
        run: node tools/english/spelling/generate.ts --check
      - name: Generated items' review record is consistent (approvals, exceptions, sheets)
        run: node tools/english/spelling/review.ts --check
      - name: Pilot allowlist matches the content (a change to the pilot boundary is a visible diff)
        working-directory: frontend
        run: node --import tsx scripts/pilot-allowlist.mts --check
      - name: Pilot approvals (what a pilot build would show; empty until an educator approves)
        run: node tools/english/pilot/review.ts approved | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Typecheck core, tests and tools
        working-directory: packages/english-core
        run: node ../../frontend/node_modules/typescript/bin/tsc -p .
      - name: Acceptance tests (E1, E2, E3a and the web app's generated items)
        working-directory: packages/english-core
        run: |
          npm test 2>&1 | tee test.log
          ../../.github/scripts/require-tests.sh test.log "English core acceptance tests"
      - name: Ten-learner simulation
        run: node tools/english/sim/main.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: End-to-end demonstration
        run: node tools/english/demo.ts
      - name: E3a evaluation harness (mock evaluators only; no network)
        run: node tools/english/e3/harness.ts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the simulation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: english-simulation-report
          path: |
            tools/english/out/simulation-*
            tools/english/out/bank-coverage.*
          if-no-files-found: ignore
