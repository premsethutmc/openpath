name: Product walkthrough (phone, shipped build)
# Runs only on walkthrough/* branches. The app code is the candidate commit unchanged; this adds only the walkthrough
# script and this workflow. Shipped build (provisional content, "Demonstration" labels), real Django API, synthetic
# learners. Nothing is deployed; screenshots are kept as a workflow artifact.
on:
  push:
    branches: ["walkthrough/**"]
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      # the shipped build (no --test): content is provisional and labelled
      - run: node scripts/build-mathematics-journey.mjs && node scripts/build-year.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Walk through four chapters on a phone-sized browser
        shell: bash
        run: |
          python backend/manage.py migrate --noinput
          # TEST ONLY: the existing per-pupil clock for synthetic pupils, used once for the delayed check
          export OPENPATH_TEST_CLOCK_FILE=/tmp/walk-clock.json
          echo '{}' > "$OPENPATH_TEST_CLOCK_FILE"
          python backend/manage.py runserver 127.0.0.1:8014 --noreload --nothreading > /tmp/walk-api.log 2>&1 &
          api_pid=$!
          PORT=4190 API_TARGET=http://127.0.0.1:8014 node frontend/scripts/preview-english.mjs > /tmp/walk-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$api_pid" "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4190/api/account/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          WALK_URL=http://127.0.0.1:4190 WALK_API=django OPENPATH_TEST_CLOCK_FILE=$OPENPATH_TEST_CLOCK_FILE SHOTS=/tmp/walk/ node --import tsx e2e/walkthrough/product-walkthrough.mjs 2>&1 | tee /tmp/walk/run.log
          echo "${GITHUB_SHA}" > /tmp/walk/commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-walkthrough
          path: /tmp/walk/
          retention-days: 14
          if-no-files-found: ignore
