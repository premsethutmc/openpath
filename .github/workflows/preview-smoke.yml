name: Private Render preview build and learner smoke tests
on:
  pull_request:
    paths: ['deploy/preview/**', 'render.preview.yaml', '.dockerignore', 'frontend/**', 'backend/**', 'packages/**', 'content/**', 'shared/**', '.github/workflows/preview-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the exact Render image
        run: docker build -f deploy/preview/Dockerfile -t openpath-preview:test .
      - name: Start synthetic-only preview
        run: |
          docker run -d --name preview -p 127.0.0.1:10000:10000 \
            -e DEMO_PASSWORD=synthetic-preview-test-pass \
            -e DEMO_SESSION_SECRET="$(openssl rand -base64 48)" \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DEMO_ALLOW_HTTP=1 -e PREVIEW_ORIGIN=http://127.0.0.1:10000 \
            -e DATABASE_URL=postgres://must-not-use:synthetic@unreachable.invalid/production \
            openpath-preview:test
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:10000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/healthz
      - name: Django regressions in an isolated test database inside the image
        run: docker exec -e DATABASE_URL= -e DJANGO_SETTINGS_MODULE=config.settings -e DJANGO_DEBUG=1 -w /app/backend preview python manage.py test --noinput
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Password gate, packaged routes, real recognition and actual Django learning journeys
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:10000
          PREVIEW_PASSWORD: synthetic-preview-test-pass
        run: node --import tsx --test --test-concurrency=1 scripts/preview-server.test.mjs scripts/demo-server.test.mjs e2e/preview-container.test.mjs e2e/writing-year.test.mjs
      - name: Restart with the existing synthetic database and verify resume
        run: |
          docker restart preview
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:10000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/healthz
          cd frontend
          E2E_URL=http://127.0.0.1:10000 PREVIEW_PASSWORD=synthetic-preview-test-pass PREVIEW_PHASE=resume node --import tsx --test e2e/preview-container.test.mjs
      - if: always()
        run: docker logs preview --tail 80
# Build and tests only. No Render API, deployment, paid resources or real learner data.
