name: PR 55 preview smoke test
# Builds the private preview container (deploy/preview) exactly as Render will, runs it against a throwaway
# PostgreSQL, and checks the password gate, one account for English and Mathematics, the Tamil entry point and a
# restart. Nothing is deployed from here.
on:
  push:
    branches: [preview/render-pr55]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: openpath_preview
          POSTGRES_USER: openpath_preview
          POSTGRES_PASSWORD: throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpath_preview" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the preview image (as Render does)
        run: docker build -f deploy/preview/Dockerfile -t openpath-preview .
      - name: Start the preview container
        run: |
          docker run -d --name preview --network host \
            -e PORT=10000 -e DEMO_PASSWORD=test-preview-pass -e DEMO_SESSION_SECRET=$(openssl rand -base64 48) \
            -e DJANGO_SECRET_KEY=$(openssl rand -base64 48) -e DEMO_ALLOW_HTTP=1 -e OPENPATH_SECURE_COOKIES=0 \
            -e PREVIEW_ORIGIN=http://localhost:10000 -e RENDER_EXTERNAL_HOSTNAME=localhost \
            -e DATABASE_URL=postgres://openpath_preview:throwaway@127.0.0.1:5432/openpath_preview \
            openpath-preview
          for i in $(seq 1 60); do curl -fsS http://localhost:10000/healthz && break; sleep 2; done
          for i in $(seq 1 90); do docker logs preview 2>&1 | grep -q 'Listening at' && break; sleep 2; done
          docker logs preview | tail -20
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Phase 1 (register, learner, mathematics activity, English and Tamil entry points)
        working-directory: frontend
        run: |
          set +e
          PHASE=write node --test e2e/preview-smoke.test.mjs 2>&1 | tee smoke-write.txt
          s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then grep -E "PAGEERROR|CONSOLEERROR|BODY|Error|expected|actual|waiting for|locator|smoke.test.mjs:" smoke-write.txt | head -20 | while read -r l; do echo "::error::$l"; done; fi
          exit $s
      - name: Restart the container (as Render does after sleeping)
        run: |
          docker restart preview
          for i in $(seq 1 60); do curl -fsS http://localhost:10000/healthz && break; sleep 2; done
          sleep 5
      - name: Phase 2 (sign in again; same learner and progress)
        working-directory: frontend
        run: |
          set +e
          PHASE=read node --test e2e/preview-smoke.test.mjs 2>&1 | tee smoke-read.txt
          s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then grep -E "PAGEERROR|CONSOLEERROR|BODY|Error|expected|actual|waiting for|locator|smoke.test.mjs:" smoke-read.txt | head -20 | while read -r l; do echo "::error::$l"; done; fi
          exit $s
      - if: always()
        run: docker logs preview | tail -80
