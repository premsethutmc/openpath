name: Mathematical writing integration
on:
  pull_request:
    paths: ['frontend/src/writing/**', 'frontend/src/year/**', 'frontend/src/english/ui/App.tsx', 'frontend/scripts/build-mathematics-journey.mjs', 'frontend/assets/recognition/**', 'frontend/e2e/writing*.test.mjs', 'frontend/package*.json', 'frontend/scripts/build-writing.mjs', 'backend/family/**', '.github/workflows/mathematical-writing.yml']
  push:
    branches: ['feat/mathematical-writing-workspace-v1', 'feat/mathematical-writing-integration-v2', 'feat/mathematical-writing-learning-year-v3']
permissions:
  contents: read
jobs:
  real-input-and-django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python ../backend/manage.py test
      - run: python ../backend/manage.py makemigrations --check --dry-run
      - run: node scripts/build-mathematics-journey.mjs
      - run: npx playwright install --with-deps chromium
      - name: Actual backend, keyboard-only policy and retained model compatibility
        run: |
          python ../backend/manage.py migrate --noinput
          python ../backend/manage.py runserver 127.0.0.1:8674 --noreload --nothreading > /tmp/writing-api.log 2>&1 &
          api_pid=$!
          DIST=dist-english PORT=4674 API_TARGET=http://127.0.0.1:8674 node scripts/preview-english.mjs > /tmp/writing-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$api_pid" "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4674/api/account/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4674/api/account/ > /dev/null
          E2E_URL=http://127.0.0.1:4674 node --test e2e/writing-year.test.mjs e2e/writing-integration.test.mjs e2e/writing-recognition.test.mjs e2e/writing.test.mjs e2e/writing-components.test.mjs
      # Tests only. No deployment, paid services or real learner database.
