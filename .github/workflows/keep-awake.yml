name: Keep the family site awake (daytime, India)
# The free hosting plan puts the site to sleep after about 15 minutes without a visit, and the next visitor waits about
# a minute while it starts. This asks for the sign-in page every 5 minutes between 05:30 and 23:25 India time, so the
# site is awake when families use it and still sleeps at night (which keeps it inside the plan's free monthly hours).
# The address is NOT in this public repository: it is the repository variable FAMILY_SITE_URL, set by the owner.
# Nothing is signed in to and nothing is sent: one GET of the sign-in page.
on:
  schedule:
    - cron: "*/5 0-17 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: keep-awake
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask for the sign-in page
        env:
          SITE: ${{ vars.FAMILY_SITE_URL }}
        run: |
          if [ -z "$SITE" ]; then echo "FAMILY_SITE_URL is not set; nothing to do."; exit 0; fi
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 120 "$SITE/login" || true)
          echo "The site answered $code."
