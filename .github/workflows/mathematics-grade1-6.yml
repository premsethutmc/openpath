name: Grade 1–6 mathematics private review
on:
  push:
    branches: [feat/grade1-6-mathematics-foundation]
  pull_request:
    paths: ['content/mathematics/foundation/**', 'packages/mathematics/**', 'frontend/src/mathematics/**', 'frontend/e2e/mathematics-foundation.test.mjs', 'frontend/scripts/build-mathematics-foundation.mjs', 'backend/family/**', '.github/workflows/mathematics-grade1-6.yml']
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm test
        working-directory: frontend
      - run: python manage.py test --noinput
        working-directory: backend
      - run: node scripts/build-mathematics-foundation.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Synthetic phone and tablet interactions
        shell: bash
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py runserver 127.0.0.1:8012 --noreload --nothreading > /tmp/foundation-api.log 2>&1 &
          foundation_api_pid=$!
          PORT=4182 API_TARGET=http://127.0.0.1:8012 node frontend/scripts/preview-english.mjs > /tmp/foundation-preview.log 2>&1 &
          foundation_preview_pid=$!
          trap 'kill "$foundation_api_pid" "$foundation_preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4182/api/account/ > /dev/null; then break; fi
            sleep 1
          done
          cd frontend
          CHROMIUM_PATH='' node --import tsx --test e2e/mathematics-foundation.test.mjs e2e/mathematics-journey.test.mjs
      # No Pages, hosting or deployment. Repository access governs artifact downloads.
      - uses: actions/upload-artifact@v7
        with:
          name: grade1-6-local-review-build
          path: frontend/dist-english/
          retention-days: 7
          if-no-files-found: error
