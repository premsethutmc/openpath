# TEMPORARY (remove before merging): runs this branch's checks on push and writes the outcome to the branch
# ci-results/spelling-teach-patterns, so the result can be read without opening GitHub.
name: Branch check (temporary)

on:
  push:
    branches: ["feat/spelling-teach-patterns"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpath
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openpath:openpath@127.0.0.1:5432/openpath
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      OPENPATH_TRUST_CLIENT_CLOCK: "1"
      OPENPATH_SECURE_COOKIES: "0"
      OPENPATH_ACCOUNT_RATE: "1000/hour"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run and record
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/out
          R=/tmp/out/RESULT.md
          echo "# Branch check for $GITHUB_SHA" > $R
          echo "run: $GITHUB_RUN_ID at $(date -u +%FT%TZ)" >> $R
          pip install -q -r backend/requirements.txt > /tmp/out/pip.log 2>&1; echo "pip_install_exit=$?" >> $R
          cd frontend
          npm ci > /tmp/out/npm.log 2>&1; echo "npm_ci_exit=$?" >> $R
          npx playwright install --with-deps chromium > /tmp/out/pw.log 2>&1; echo "playwright_install_exit=$?" >> $R
          npm run english:build > /tmp/out/build.log 2>&1; echo "english_build_exit=$?" >> $R
          (cd ../backend && python manage.py migrate > /tmp/out/migrate.log 2>&1; echo "migrate_exit=$?" >> $R; nohup python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/out/api.log 2>&1 &)
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/
          nohup npm run english:preview > /tmp/out/web.log 2>&1 &
          PORT=4175 API_TARGET=http://127.0.0.1:8000 nohup npm run english:preview > /tmp/out/web-api.log 2>&1 &
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4174/
          curl -s -o /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4175/
          for t in parent-content accounts; do
            E2E_URL=http://127.0.0.1:4175 node --test e2e/$t.test.mjs > /tmp/out/e2e-$t.log 2>&1; echo "e2e_account_${t}_exit=$?" >> $R
          done
          for f in e2e-parent-content e2e-accounts; do
            echo -e "\n## $f\n\`\`\`" >> $R; grep -E "^(not )?ok |^# (pass|fail)|error:|waiting for|expected:|actual:|parent-content.test.mjs:[0-9]+|accounts.test.mjs:[0-9]+|^    [^ ]" /tmp/out/$f.log | cut -c1-240 | head -60 >> $R; echo '```' >> $R
          done
      - name: Publish the result to a branch
        shell: bash
        run: |
          cd /tmp/out
          git init -q -b ci-results/spelling-teach-patterns
          git config user.name "branch-check"
          git config user.email "branch-check@users.noreply.github.com"
          git add RESULT.md
          git commit -q -m "Branch check result for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results/spelling-teach-patterns
