# TEMPORARY (remove before merging): runs this branch's checks on push and writes the outcome to the branch
# ci-results/join-streams, so the result can be read without opening GitHub.
name: Branch check (temporary)

on:
  push:
    branches: ["feat/join-streams"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openpath
          POSTGRES_USER: openpath
          POSTGRES_PASSWORD: openpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openpath:openpath@127.0.0.1:5432/openpath
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      OPENPATH_TRUST_CLIENT_CLOCK: "1"
      OPENPATH_SECURE_COOKIES: "0"
      OPENPATH_ACCOUNT_RATE: "1000/hour"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run and record
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/out
          R=/tmp/out/RESULT.md
          echo "# Branch check for $GITHUB_SHA" > $R
          cd frontend
          npm ci > /tmp/out/npm.log 2>&1; echo "npm_ci_exit=$?" >> $R
          npm run typecheck > /tmp/out/typecheck.log 2>&1; echo "typecheck_exit=$?" >> $R
          for f in typecheck; do
            echo -e "\n## $f\n\`\`\`" >> $R; tail -40 /tmp/out/$f.log | cut -c1-300 >> $R; echo '```' >> $R
          done
      - name: Publish the result to a branch
        shell: bash
        run: |
          cd /tmp/out
          git init -q -b ci-results/join-streams
          git config user.name "branch-check"
          git config user.email "branch-check@users.noreply.github.com"
          git add RESULT.md
          git commit -q -m "Branch check result for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results/join-streams
