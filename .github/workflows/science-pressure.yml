name: OpenPath Science Labs

on:
  pull_request:
    paths:
      - 'frontend/science/**'
      - 'frontend/e2e/science-*.mjs'
      - '.github/workflows/science-pressure.yml'

permissions:
  contents: read

jobs:
  phone:
    name: Science Labs unit tests and mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test science/*/model.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check Lift the Rock on narrow and wide phones
        timeout-minutes: 2
        run: node --test --test-timeout=35000 e2e/science-lever.test.mjs
      - name: Check Sound Studio touch and audio
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --test --test-timeout=35000 e2e/science-sound.test.mjs
      - name: Check the rest of the science labs
        if: ${{ !cancelled() }}
        run: node --test $(find e2e -maxdepth 1 -name 'science-*.test.mjs' ! -name 'science-lever.test.mjs' ! -name 'science-sound.test.mjs' | sort)
        env:
          E2E_SHOTS: test-results/science
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: science-labs-phone
          path: frontend/test-results/science
          if-no-files-found: ignore
