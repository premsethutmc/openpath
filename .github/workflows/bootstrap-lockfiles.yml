# One-off: resolve dependencies against the real registries and commit the
# lockfiles to this branch. Removed again once the lockfiles are in place.
name: Bootstrap lockfiles
on:
  push:
    branches: [feature/apple-shopping-prototype]
    paths: [.github/workflows/bootstrap-lockfiles.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve frontend dependencies
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Resolve backend dependencies
        working-directory: backend
        run: |
          pip install uv
          uv pip compile requirements.in --universal --python-version 3.10 -o requirements.txt \
            --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.10 -o requirements.txt"
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/requirements.txt
          git commit -m "Add dependency lockfiles resolved on GitHub Actions"
          git push
