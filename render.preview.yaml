# OpenPath PR #55: private owner-only PREVIEW on Render (not production). English, Mathematics and the Tamil pilot,
# one password gate, one OpenPath test account for English and Mathematics, and a throwaway preview database.
# Synthetic test learners only. No paid model calls (no model keys are set). Deploys only when started by hand.
# In Render: New > Blueprint > this repository > branch preview/render-pr55 > Blueprint file: render.preview.yaml
services:
  - type: web
    name: openpath-pr55-preview
    runtime: docker
    plan: free
    region: singapore
    branch: preview/render-pr55
    autoDeployTrigger: "off"
    dockerfilePath: ./deploy/preview/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # the password you will type on the phone (Render asks for it once; at least 8 characters)
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_SESSION_SECRET
        generateValue: true
      - key: DEMO_SESSION_HOURS
        value: "168"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: OPENPATH_SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: openpath-pr55-preview-db
          property: connectionString
databases:
  - name: openpath-pr55-preview-db
    plan: free
    region: singapore
    databaseName: openpath_preview
    user: openpath_preview
    ipAllowList: []
