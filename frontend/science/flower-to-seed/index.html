<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f1e7"><title>Flower to Seed · OpenPath</title>
<link rel="stylesheet" href="./garden.css">
</head>
<body>
<header class="mast"><a href="../">OpenPath <span>/ Science Labs</span></a><span>ICSE · CLASS 5</span></header>
<main>
  <header class="hero"><p class="eyebrow">FIELD LAB 07 &nbsp; / &nbsp; LIVING THINGS</p><h1>Flower to Seed</h1></header>
  <button type="button" id="garden-sound" class="sound-button" aria-label="Garden sound" aria-pressed="false"><span aria-hidden="true">♪</span> <span id="sound-state">Sound off</span></button>
  <nav class="stops" aria-label="Garden stations">
    <button data-stop="garden" aria-current="step"><span>01</span> Pollinate</button>
    <button data-stop="cutaway"><span>02</span> Grow a pod</button>
    <button data-stop="travel"><span>03</span> Send seeds</button>
    <button data-stop="check"><span>04</span> Grow again</button>
  </nav>
  <section class="lab" aria-label="Interactive garden">
    <div class="stage" id="stage">
      <div class="scene-meta"><span id="scene-index"></span><span id="scene-name"></span></div>
      <div id="scene"></div>
    </div>
    <aside class="guide">
      <p class="eyebrow" id="chapter"></p><h2 id="heading"></h2><p id="description"></p>
      <div id="controls"></div>
      <output id="observation" role="status" aria-live="polite"></output>
    </aside>
  </section>
  <footer><a href="../plant-a-seed/">Keep growing: Plant a Seed →</a><span>Illustrated model · Time is compressed</span></footer>

</main>
<dialog id="bee-story" class="bee-story" aria-labelledby="film-title">
  <header class="film-header"><h2 id="film-title">A Bee’s Morning</h2><span>20-second story</span></header>
  <div class="film-image"></div>
  <div class="film-line"><p class="film-shot"></p><p class="film-caption" aria-live="polite"></p></div>
  <progress value="0" max="20" aria-label="Story playback"></progress>
  <div class="film-controls"><button type="button" data-film-action="pause">Ⅱ Pause</button><button type="button" data-film-action="exit" autofocus>Take over the bee →</button></div>
</dialog>
<script type="module" src="./garden.mjs"></script>
</body>
</html>
