<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cfeaf0" />
    <title>OpenPath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!--styles-->
  </head>
  <body>
    <div id="root"><p class="loading">Getting the shop ready…</p></div>
    <script>
      // If the app cannot start, say so on the page instead of staying blank.
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.dataset.started) return;
        var note = document.createElement("p");
        note.className = "loading";
        note.textContent = "OpenPath could not start: " + (event.message || "the page script failed to load") + ".";
        root.replaceChildren(note);
      });
    </script>
    <!--script-->
  </body>
</html>
